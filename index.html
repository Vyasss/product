<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search, filter and sort a catalog of 5,000 products." />
    <!--
      Link previews (WhatsApp, Teams, email clients). Preview fetchers read this HTML and do not
      run JavaScript, so this is the card for every URL except product pages, which get their
      own copy of this file from scripts/product-previews.mjs.
      __SITE_URL__ is replaced at build time with VITE_SITE_URL (see vite.config.ts): preview
      images must be absolute URLs.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AllinONE" />
    <meta property="og:title" content="AllinONE: everything in one place" />
    <meta property="og:description" content="Search, filter and sort a catalog of 5,000 products." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#003974" />
    <title>AllinONE</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This catalog needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
